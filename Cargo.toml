[package]
name = "rust-mlx-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", branch = "master", features = ["metal"] }
rustyline = "19.0.0"
serde_json = "1.0"
termimad = "0.35.5"
tokio = { version = "1", features = ["full"] }
